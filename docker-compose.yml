name: agent-template

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  AGENT_RUNTIME: ${AGENT_RUNTIME:-claude}
  DATABASE_URL: postgresql://project_template:project_template@postgres:5432/project_template?schema=public
  REDIS_URL: redis://redis:6379
  TOOLBOX_URL: http://toolbox:15000
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.kimi.com/coding/}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-kimi-for-coding}
  CLAUDE_AGENT_MODEL: ${CLAUDE_AGENT_MODEL:-kimi-for-coding}
  CLAUDE_AGENT_STATE_DIR: ${CLAUDE_AGENT_STATE_DIR:-/var/lib/agent-template/claude}
  CLAUDE_AGENT_CONTINUATION_SECRET: ${CLAUDE_AGENT_CONTINUATION_SECRET:-}
  CLAUDE_AGENT_CONTINUATION_LEASE_MS: ${CLAUDE_AGENT_CONTINUATION_LEASE_MS:-150000}
  CLAUDE_AGENT_CONTINUATION_TTL_MS: ${CLAUDE_AGENT_CONTINUATION_TTL_MS:-604800000}
  CLAUDE_AGENT_MAX_TURNS: ${CLAUDE_AGENT_MAX_TURNS:-100}
  CLAUDE_AGENT_MAX_BUDGET_USD: ${CLAUDE_AGENT_MAX_BUDGET_USD:-5}
  CLAUDE_AGENT_REQUEST_TIMEOUT_MS: ${CLAUDE_AGENT_REQUEST_TIMEOUT_MS:-120000}
  EVE_AGENT_HOST: ${EVE_AGENT_HOST:-http://eve-agent:13010}
  EVE_AGENT_MAX_RECONNECT_ATTEMPTS: ${EVE_AGENT_MAX_RECONNECT_ATTEMPTS:-5}
  EVE_AGENT_MODEL: ${EVE_AGENT_MODEL:-kimi-for-coding}
  EVE_AGENT_REQUEST_TIMEOUT_MS: ${EVE_AGENT_REQUEST_TIMEOUT_MS:-120000}
  EVE_AGENT_SERVICE_TOKEN: ${EVE_AGENT_SERVICE_TOKEN:-}
  EVE_MODEL_CONTEXT_WINDOW_TOKENS: ${EVE_MODEL_CONTEXT_WINDOW_TOKENS:-128000}
  EVE_COMPACTION_THRESHOLD: ${EVE_COMPACTION_THRESHOLD:-0.75}
  EVE_MAX_INPUT_TOKENS_PER_SESSION: ${EVE_MAX_INPUT_TOKENS_PER_SESSION:-1000000}
  EVE_MAX_OUTPUT_TOKENS_PER_SESSION: ${EVE_MAX_OUTPUT_TOKENS_PER_SESSION:-100000}
  CLAUDE_CODE_AUTO_COMPACT_WINDOW: ${CLAUDE_CODE_AUTO_COMPACT_WINDOW:-262144}

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
    provenance: false
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: project_template
      POSTGRES_PASSWORD: project_template
      POSTGRES_DB: project_template
    ports:
      - "15432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_template -d project_template"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  toolbox:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.14.0
    restart: unless-stopped
    command:
      [
        "--address",
        "0.0.0.0",
        "--port",
        "15000",
        "--allowed-hosts",
        "localhost,localhost:15000,127.0.0.1,127.0.0.1:15000,toolbox,toolbox:15000",
        "--allowed-origins",
        "http://localhost:13000,http://localhost:14000",
        "--config",
        "/app/tools.yaml",
      ]
    environment:
      TOOLBOX_POSTGRES_HOST: postgres
      TOOLBOX_POSTGRES_PORT: 5432
      TOOLBOX_POSTGRES_DATABASE: project_template
      TOOLBOX_POSTGRES_USER: project_template
      TOOLBOX_POSTGRES_PASSWORD: project_template
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "15000:15000"
    volumes:
      - ./apps/toolbox/tools.yaml:/app/tools.yaml:ro

  api:
    <<: *app-service
    command: pnpm --filter @agent-template/api start
    environment:
      <<: *runtime-environment
      API_HOST: 0.0.0.0
      API_PORT: 14000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      toolbox:
        condition: service_started
      eve-agent:
        condition: service_healthy
    ports:
      - "14000:14000"
    volumes:
      - claude_state:/var/lib/agent-template/claude
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:14000/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *app-service
    command: pnpm --filter @agent-template/worker start
    environment:
      <<: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      toolbox:
        condition: service_started
      eve-agent:
        condition: service_healthy
    volumes:
      - claude_state:/var/lib/agent-template/claude

  eve-agent:
    <<: *app-service
    command: sh -c "pnpm --filter @agent-template/agent-eve eve:build && pnpm --filter @agent-template/agent-eve eve:start"
    environment:
      <<: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      toolbox:
        condition: service_started
    ports:
      - "13010:13010"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:13010/eve/v1/health >/dev/null",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    <<: *app-service
    command: pnpm --filter @agent-template/web start
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:14000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "13000:13000"

volumes:
  claude_state:
  postgres18_data:
  redis_data:
