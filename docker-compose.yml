name: agent-template

x-agent-client-environment: &agent-client-environment
  NODE_ENV: production
  EVE_AGENT_HOST: http://runtime:13010
  EVE_AGENT_SERVICE_TOKEN: ${EVE_AGENT_SERVICE_TOKEN:-}
  EVE_AGENT_REQUEST_TIMEOUT_MS: ${EVE_AGENT_REQUEST_TIMEOUT_MS:-120000}
  EVE_AGENT_MAX_RECONNECT_ATTEMPTS: ${EVE_AGENT_MAX_RECONNECT_ATTEMPTS:-5}

x-app-service: &app-service
  restart: unless-stopped
  init: true
  stop_grace_period: 150s

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: project_template
      POSTGRES_PASSWORD: project_template
      POSTGRES_DB: project_template
    ports:
      - "15432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_template -d project_template"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  toolbox:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.14.0
    restart: unless-stopped
    command:
      [
        "--address",
        "0.0.0.0",
        "--port",
        "15000",
        "--allowed-hosts",
        "localhost,localhost:15000,127.0.0.1,127.0.0.1:15000,toolbox,toolbox:15000",
        "--allowed-origins",
        "http://localhost:13000,http://localhost:14000",
        "--config",
        "/app/tools.yaml",
      ]
    environment:
      TOOLBOX_POSTGRES_HOST: postgres
      TOOLBOX_POSTGRES_PORT: 5432
      TOOLBOX_POSTGRES_DATABASE: project_template
      TOOLBOX_POSTGRES_USER: project_template
      TOOLBOX_POSTGRES_PASSWORD: project_template
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "15000:15000"
    volumes:
      - ./apps/toolbox/tools.yaml:/app/tools.yaml:ro

  api:
    <<: *app-service
    build:
      context: .
      target: api
    environment:
      <<: *agent-client-environment
      API_HOST: 0.0.0.0
      API_PORT: 14000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:13000}
      DATABASE_URL: postgresql://project_template:project_template@postgres:5432/project_template?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runtime:
        condition: service_healthy
    ports:
      - "14000:14000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:14000/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *app-service
    build:
      context: .
      target: worker
    environment:
      <<: *agent-client-environment
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    depends_on:
      redis:
        condition: service_healthy
      runtime:
        condition: service_healthy

  workflow-setup:
    build:
      context: .
      target: workflow-setup
    environment:
      WORKFLOW_POSTGRES_URL: postgresql://project_template:project_template@postgres:5432/project_template
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  runtime:
    <<: *app-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 13010
      WORKFLOW_POSTGRES_URL: postgresql://project_template:project_template@postgres:5432/project_template
      WORKFLOW_POSTGRES_WORKER_CONCURRENCY: ${WORKFLOW_POSTGRES_WORKER_CONCURRENCY:-10}
      WORKFLOW_POSTGRES_MAX_POOL_SIZE: ${WORKFLOW_POSTGRES_MAX_POOL_SIZE:-10}
      TOOLBOX_URL: http://toolbox:15000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_DOCKER_BASE_URL:-http://host.docker.internal:3425/v1}
      EVE_AGENT_MODEL: ${EVE_AGENT_MODEL:-group/flash}
      EVE_MAX_OUTPUT_TOKENS: ${EVE_MAX_OUTPUT_TOKENS:-1024}
      EVE_AGENT_SERVICE_TOKEN: ${EVE_AGENT_SERVICE_TOKEN:-}
      EVE_MODEL_CONTEXT_WINDOW_TOKENS: ${EVE_MODEL_CONTEXT_WINDOW_TOKENS:-128000}
      EVE_COMPACTION_THRESHOLD: ${EVE_COMPACTION_THRESHOLD:-0.75}
      EVE_MAX_INPUT_TOKENS_PER_SESSION: ${EVE_MAX_INPUT_TOKENS_PER_SESSION:-1000000}
      EVE_MAX_OUTPUT_TOKENS_PER_SESSION: ${EVE_MAX_OUTPUT_TOKENS_PER_SESSION:-100000}
    depends_on:
      workflow-setup:
        condition: service_completed_successfully
      toolbox:
        condition: service_started
    ports:
      - "13010:13010"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:13010/eve/v1/health >/dev/null",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    <<: *app-service
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:14000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "13000:13000"

volumes:
  postgres18_data:
  redis_data:
